name: Build Windows x64 installer

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile 文件路径（相对仓库根目录）"
        required: true
        default: "profiles/libtv.json"
        type: string
      architecture:
        description: "目标 Windows 架构"
        required: true
        default: "x64"
        type: choice
        options:
          - x64
          - x86
  push:
    branches:
      - "main"

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PACKAGE_PROFILE: ${{ inputs.profile || 'profiles/libtv.json' }}
      PACKAGE_ARCH: ${{ inputs.architecture || 'x64' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Ensure selected Rust target
        shell: pwsh
        run: |
          if ($env:PACKAGE_ARCH -eq 'x86') {
            rustup target add i686-pc-windows-msvc
          } else {
            rustup target add x86_64-pc-windows-msvc
          }

      - name: Build Windows x64 installer
        run: npm run build

      - name: Diagnose packaging inputs on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "PACKAGE_PROFILE=$env:PACKAGE_PROFILE"
          Write-Host "PACKAGE_ARCH=$env:PACKAGE_ARCH"
          if (Test-Path $env:PACKAGE_PROFILE) {
            Write-Host 'Profile content:'
            Get-Content -Raw $env:PACKAGE_PROFILE
          } else {
            Write-Error 'Profile file does not exist in the checked-out repository.'
          }
          if (Test-Path 'src-tauri/.generated/tauri.profile.conf.json') {
            Write-Host 'Generated Tauri config:'
            Get-Content -Raw 'src-tauri/.generated/tauri.profile.conf.json'
          }

      - name: Create distributable and checksum
        shell: pwsh
        run: |
          $rustTarget = if ($env:PACKAGE_ARCH -eq 'x86') { 'i686-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
          $installer = Get-ChildItem "src-tauri/target/$rustTarget/release/bundle/nsis" -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not generated.' }
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          Copy-Item $installer.FullName -Destination 'artifacts'
          $copiedInstaller = Get-ChildItem 'artifacts' -Filter '*.exe' | Select-Object -First 1
          $hash = Get-FileHash $copiedInstaller.FullName -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant()) *$($copiedInstaller.Name)" | Set-Content 'artifacts/SHA256SUMS.txt' -Encoding utf8NoBOM

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: url-exe-windows-${{ inputs.architecture || 'x64' }}-nsis
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: url-exe-windows-${{ inputs.architecture || 'x64' }}-nsis
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
