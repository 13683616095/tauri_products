name: Build Windows x64 installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Ensure Rust x64 MSVC target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build Windows x64 installer
        run: npm run build

      - name: Create distributable and checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'NSIS installer was not generated.' }
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          Copy-Item $installer.FullName -Destination 'artifacts'
          $copiedInstaller = Get-ChildItem 'artifacts' -Filter '*.exe' | Select-Object -First 1
          $hash = Get-FileHash $copiedInstaller.FullName -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant()) *$($copiedInstaller.Name)" | Set-Content 'artifacts/SHA256SUMS.txt' -Encoding utf8NoBOM

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI漫剧创作-windows-x64-nsis
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: AI漫剧创作-windows-x64-nsis
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
